name: RIMS local quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rims-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-quality:
    name: Source-only validation
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out canonical source
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate project contracts
        run: python scripts/validate_project.py

      - name: Validate web-first contracts
        run: python scripts/webfirst_contracts.py validate

      - name: Validate Conductor structure
        run: python scripts/validate_conductor.py

      - name: Run read-only Power Platform tooling preflight
        run: python scripts/powerplatform_tooling.py check

      - name: Validate visual standards
        run: python scripts/validate_visual_standards.py

      - name: Validate canonical flow contracts
        run: |
          python scripts/validate_publication_platform_contract.py
          python scripts/validate_grants_flow_contract.py
          python scripts/validate_dora_activity_flow_contract.py
