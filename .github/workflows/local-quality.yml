name: RIMS local quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rims-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-quality:
    name: Source-only validation
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.1'

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate project contracts
        run: python scripts/validate_project.py

      - name: Validate web-first contracts
        run: python scripts/webfirst_contracts.py validate

      - name: Validate Conductor structure
        run: python scripts/validate_conductor.py

      - name: Run read-only Power Platform tooling preflight
        run: python scripts/powerplatform_tooling.py check

      - name: Validate visual standards
        run: python scripts/validate_visual_standards.py

      - name: Validate canonical flow contracts
        run: |
          python scripts/validate_publication_platform_contract.py
          python scripts/validate_grants_flow_contract.py
          python scripts/validate_dora_activity_flow_contract.py

  locked-dependencies:
    name: Python3.15.1 locked artifact dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.1'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          enable-cache: false
      - name: Install exact hash-locked development dependencies
        run: uv pip sync --system --require-hashes -r requirements-dev.txt
      - name: Verify installed dependency metadata and artifact libraries
        run: |
          python -m pip check
          python -c "import sys, certifi, docx, lxml.etree, openpyxl; assert sys.version_info[:3] == (3, 15, 1)"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_project.py
      - run: python scripts/webfirst_contracts.py validate
      - run: python scripts/validate_conductor.py
